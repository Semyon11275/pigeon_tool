<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' pigeon:; img-src 'self' pigeon: data: blob: https: http:; media-src 'self' pigeon: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' pigeon: data:">
  <title>Pigeon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="wallpaper" class="hidden"></div>
    <!-- 标题栏 -->
    <div id="titlebar">
      <div class="tb-left">
        <img class="logo-img" src="pigeon-icon.png" alt="">
        <span class="app-name">Pigeon</span>
        <span class="lib-name" id="library-name"></span>
      </div>
      <div class="tb-drag"></div>
      <div class="tb-buttons">
        <button id="win-min" title="最小化"><svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.1" fill="none"/></svg></button>
        <button id="win-max" title="最大化"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.1" fill="none"/></svg></button>
        <button id="win-close" class="close" title="关闭"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.1" fill="none"/></svg></button>
      </div>
    </div>

    <div id="main">
      <!-- 侧栏 -->
      <div id="sidebar"></div>

      <!-- 内容区 -->
      <div id="content">
        <div id="toolbar">
          <div class="search-box">
            <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.4" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M10.4 10.4L14 14" stroke="currentColor" stroke-width="1.3"/></svg>
            <input id="search" type="text" placeholder="搜索名称、标签、注释... (Ctrl+F)">
            <button id="search-clear" class="hidden">×</button>
            <button id="btn-ai-chip" class="ai-chip hidden" title="AI 语义搜索（本地 Chinese-CLIP）">✨AI</button>
          </div>
          <div class="tb-spacer"></div>
          <button class="tb-btn" id="btn-import" title="导入">
            <svg viewBox="0 0 16 16"><path d="M8 2v8M5 7.5L8 10.5l3-3" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/><path d="M2.5 11v1.5a1 1 0 001 1h9a1 1 0 001-1V11" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
            导入
          </button>
          <button class="tb-btn" id="btn-filter">
            <svg viewBox="0 0 16 16"><path d="M2.5 3.5h11L9.5 8.7v4.8l-3-1.6V8.7z" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/></svg>
            筛选
          </button>
          <div class="tb-sep"></div>
          <div class="view-group" id="view-group">
            <button data-layout="waterfall" title="瀑布流 (Alt+1)">
              <svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="7" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="11" width="5" height="3" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
            </button>
            <button data-layout="grid" title="网格 (Alt+2)">
              <svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
            </button>
            <button data-layout="list" title="列表 (Alt+3)">
              <svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="2.4" rx="1"/><rect x="2" y="7" width="12" height="2.4" rx="1"/><rect x="2" y="11" width="12" height="2.4" rx="1"/></svg>
            </button>
          </div>
          <input type="range" id="zoom" min="120" max="360" step="10" value="220" title="缩略图大小">
          <div class="tb-sep"></div>
          <button class="tb-btn" id="btn-browser" title="内置浏览器">
            <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M2 8h12M8 2c-3.2 3.6-3.2 8.4 0 12M8 2c3.2 3.6 3.2 8.4 0 12" stroke="currentColor" stroke-width="1.1" fill="none"/></svg>
            浏览器
          </button>
          <button class="tb-btn" id="btn-dup" title="扫描重复文件">
            <svg viewBox="0 0 16 16"><rect x="2" y="4.5" width="8" height="9" rx="1.2" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M5.5 2h7A1.5 1.5 0 0114 3.5v7" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
            查重
          </button>
          <div class="tb-sep"></div>
          <button class="tb-btn" id="btn-sort">
            <svg viewBox="0 0 16 16"><path d="M3 12.5V3.5M3 3.5L1.5 5M3 3.5L4.5 5" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/><path d="M6.5 4h8M6.5 8h6M6.5 12h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            <span id="sort-label">添加时间</span>
          </button>
          <button class="tb-btn" id="btn-inspector" title="信息面板 (Ctrl+Alt+2)">
            <svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M5.5 5.5h5M5.5 8h5M5.5 10.5h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </button>
        </div>

        <div id="filter-bar" class="hidden"></div>
        <div id="view-title"></div>

        <div id="grid-wrap">
          <div id="grid"></div>
          <div id="empty-hint" class="hidden"></div>
          <div id="drop-overlay" class="hidden"><div class="drop-box">松开以导入文件</div></div>
        </div>

        <div id="statusbar">
          <button class="st-btn-settings" id="btn-settings" title="设置">
            <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6L11 5M5 11l-1.4 1.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            设置
          </button>
          <button class="st-btn" id="btn-gray" title="灰度模式">
            <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M8 2.5v11A5.5 5.5 0 008 2.5z" fill="currentColor"/></svg>
          </button>
          <span id="status-count"></span>
          <span id="status-sel"></span>
          <div class="sb-spacer"></div>
          <span id="status-lib"></span>
        </div>
      </div>

      <!-- 信息面板 -->
      <div id="inspector"></div>
    </div>

    <!-- 设置 -->
    <div id="settings-panel" class="hidden">
      <div class="set-wrap">
        <div class="set-page-title">设置</div>
        <div id="settings-body"></div>
      </div>
    </div>

    <!-- 大图预览 -->
    <div id="preview" class="hidden"></div>

    <!-- 内置浏览器 -->
    <div id="browser-panel" class="hidden">
      <div class="br-bar">
        <button id="br-back" title="后退">‹</button>
        <button id="br-fwd" title="前进">›</button>
        <button id="br-reload" title="刷新">⟳</button>
        <input id="br-url" placeholder="输入网址，回车打开">
        <button id="br-external" title="在系统浏览器打开">↗</button>
        <button id="br-close" title="关闭浏览器">✕</button>
      </div>
      <div class="br-loading" id="br-loading"></div>
      <webview id="br-webview" src="about:blank"></webview>
    </div>

    <!-- URL 导入 -->
    <div id="url-modal" class="modal hidden">
      <div class="modal-box wide">
        <div class="modal-title">从 URL 导入</div>
        <div class="url-row">
          <input id="url-input" placeholder="粘贴网页链接或图片直链，回车获取">
          <button id="url-fetch">获取</button>
        </div>
        <div class="url-status" id="url-status">提示：也可以直接把网页里的图片拖进窗口，或 Ctrl+V 粘贴链接</div>
        <div class="url-grid" id="url-grid"></div>
        <div class="modal-btns">
          <button id="url-cancel">取消</button>
          <button id="url-import" class="primary">导入所选（0）</button>
        </div>
      </div>
    </div>

    <!-- 重复扫描 -->
    <div id="dup-modal" class="modal hidden">
      <div class="modal-box wide">
        <div class="modal-title">扫描重复文件</div>
        <div id="dup-body">
          <div class="dup-modes">
            <button id="dup-mode-same"><b>扫描「相同」文件</b><span>MD5 校验，找出内容完全一致的文件</span></button>
            <button id="dup-mode-similar"><b>扫描「相似」图像</b><span>感知哈希 pHash，找出看起来相似的图片</span></button>
          </div>
        </div>
        <div class="url-status" id="dup-status"></div>
        <div class="dup-groups" id="dup-groups"></div>
        <div class="modal-btns hidden" id="dup-actions">
          <button id="dup-close">关闭</button>
          <button id="dup-merge" class="primary">合并（保留最优，重复进回收站）</button>
        </div>
      </div>
    </div>

    <!-- 欢迎页 -->
    <div id="welcome" class="hidden"></div>

    <!-- 右键菜单 / 弹出菜单 -->
    <div id="menu-layer" class="hidden"></div>
    <div id="toast" class="hidden"></div>
  </div>
  <script src="vendor/heic2any.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
