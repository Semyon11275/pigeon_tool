<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>截图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; }
    canvas { display: block; }
    #tip {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      background: rgba(31,32,35,.85); color: #d6d8de; padding: 8px 18px;
      border-radius: 18px; font: 13px "Segoe UI", "Microsoft YaHei", sans-serif;
      z-index: 10; pointer-events: none;
    }
    #size {
      position: fixed; display: none; background: rgba(0,0,0,.7); color: #fff;
      font: 11px Consolas, monospace; padding: 2px 7px; border-radius: 4px; z-index: 10; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>
  <div id="tip">拖动框选要收藏的区域 · 双击全屏 · Enter 确认 · Esc 取消</div>
  <div id="size"></div>
  <script src="capture.js"></script>
</body>
</html>
